name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project that opens the live app
        run: |
          mkdir -p www
          echo '<!doctype html><html><body>Loading Household Admin...</body></html>' > www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.householdadmin.app",
            "appName": "Household Admin",
            "webDir": "www",
            "server": {
              "url": "https://household-admin.onrender.com",
              "cleartext": false
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: household-admin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
